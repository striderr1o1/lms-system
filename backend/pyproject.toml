[project]
name = "lms-backend"
version = "0.1.0"
description = "LMS API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
